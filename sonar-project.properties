# SonarCloud project configuration
# https://docs.sonarcloud.io/advanced-setup/ci-based-analysis/sonarscanner-for-npm/

sonar.projectKey=GlidegoCarRentals_Website
sonar.organization=glidegocarrentals

# Sources to analyze
sonar.sources=src
sonar.tests=src

# Exclude generated, config, and SQL migration files from analysis
sonar.exclusions=\
  **/node_modules/**,\
  **/.next/**,\
  **/dist/**,\
  **/coverage/**,\
  **/*.config.js,\
  **/*.config.ts,\
  **/next-env.d.ts,\
  supabase/**

# SQL files contain intentionally repeated literals (column defaults, DDL patterns)
# These are idiomatic SQL and cannot be replaced with constants in DDL context.
# Suppressed: sqli:S1192 (String literals should not be duplicated)
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=sqli:S1192
sonar.issue.ignore.multicriteria.e1.resourceKey=supabase/**
